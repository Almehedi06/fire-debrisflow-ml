data:
  dir: /mnt/c/Users/amehedi/Downloads/ml_debris/output/thomas
  target_name: dem_diff.tif
  include_names:
    - burn__severity.tif
    - cation__exchange_capacity.tif
    - clay__total.tif
    - dry__bulk_density.tif
    - field__capacity.tif
    - landcover.tif
    - pH.tif
    - porosity.tif
    - sand__total.tif
    - saturated__water_content.tif
    - silt__total.tif
    - soil__density.tif
    - soil__internal_friction_angle.tif
    - soil__maximum_total_cohesion.tif
    - soil__minimum_total_cohesion.tif
    - soil__mode_total_cohesion.tif
    - soil__saturated_hydraulic_conductivity.tif
    - soil__texture.tif
    - soil__thickness.tif
    - soil__transmissivity.tif
    - topographic__elevation.tif
    - vegetation__plant_functional_type.tif
    - wilting__point.tif

split:
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  block_size: 128
  random_state: 42

model:
  type: cnn
  hidden_channels: 32
  num_layers: 4

training:
  patch_size: 64
  stride: 32
  min_valid_fraction: 0.2
  batch_size: 16
  epochs: 80
  learning_rate: 0.0005
  weight_decay: 0.0001

output:
  model_dir: models/cnn
  run_prefix: cnn

runtime:
  device: auto
