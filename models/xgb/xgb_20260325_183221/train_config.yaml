data:
  dir: /mnt/c/Users/amehedi/Downloads/ml_debris/output/thomas
  target_name: dem_diff.tif
  include_names:
    - burn__severity.tif
    - cation__exchange_capacity.tif
    - clay__total.tif
    - dry__bulk_density.tif
    - field__capacity.tif
    - landcover.tif
    - pH.tif
    - porosity.tif
    - sand__total.tif
    - saturated__water_content.tif
    - silt__total.tif
    - soil__density.tif
    - soil__internal_friction_angle.tif
    - soil__maximum_total_cohesion.tif
    - soil__minimum_total_cohesion.tif
    - soil__mode_total_cohesion.tif
    - soil__saturated_hydraulic_conductivity.tif
    - soil__texture.tif
    - soil__thickness.tif
    - soil__transmissivity.tif
    - topographic__elevation.tif
    - vegetation__plant_functional_type.tif
    - wilting__point.tif

split:
  method: spatial_block_cv
  test_size: 0.2
  block_size: 64
  n_folds: 5
  selection_metric: r2
  random_state: 42

model:
  type: xgb
  n_estimators: 50
  max_depth: 6
  learning_rate: 0.06
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5.0
  gamma: 0.1
  reg_alpha: 1.0
  reg_lambda: 2.0
  tree_method: approx
  max_bin: 256
  verbosity: 0
  random_state: 42
  n_jobs: 12
  # search_grid:
  #   n_estimators: [50, 70, 100]
  #   max_depth: [4, 6, 8]
  #   learning_rate: [0.04, 0.05, 0.06]
  #   min_child_weight: [1.0, 5.0]
  #   subsample: [0.8, 1.0]
  #   colsample_bytree: [0.8, 1.0]

output:
  model_dir: models/xgb
  run_prefix: xgb
